# Reverse proxy for the Piston sandbox. Runs on the same VM as the Piston
# container (see "Production: Piston on an Azure VM" in README.md).
#
# Piston itself has no authentication and is bound to 127.0.0.1 only, so this
# is the ONLY public entry point. It rejects any request that doesn't carry the
# shared API key (X-API-Key header) before forwarding to the container, and
# certbot adds HTTPS on top.
#
# Setup on the VM:
#   1. sudo apt install -y nginx certbot python3-certbot-nginx
#   2. Generate the key:  openssl rand -hex 32
#      The SAME value goes into PISTON_API_KEY in Vercel's env vars.
#   3. Replace REPLACE_WITH_KEY and REPLACE_WITH_HOSTNAME below.
#   4. sudo cp piston-nginx.conf /etc/nginx/sites-available/piston
#   5. sudo ln -sf /etc/nginx/sites-available/piston /etc/nginx/sites-enabled/piston
#   6. sudo rm -f /etc/nginx/sites-enabled/default
#   7. sudo nginx -t && sudo systemctl reload nginx
#   8. sudo certbot --nginx -d REPLACE_WITH_HOSTNAME
#      (issues a Let's Encrypt certificate, adds the HTTPS listener, and
#      renews automatically)
#   9. In the cloud network rules, allow inbound TCP 22, 80 and 443 only.
#      Never open port 2000 — Piston must stay reachable only through here.

server {
    listen 80;
    server_name REPLACE_WITH_HOSTNAME;
    client_max_body_size 1m;

    location / {
        if ($http_x_api_key != "REPLACE_WITH_KEY") {
            return 401;
        }
        proxy_pass http://127.0.0.1:2000;
        proxy_read_timeout 60s;
    }
}
