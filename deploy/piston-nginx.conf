# Reverse proxy for the Piston sandbox, run on the Oracle VM alongside
# docker-compose.piston.yml. Piston itself has no authentication and binds
# to 127.0.0.1 only (see docker-compose.piston.yml) — this is the ONLY
# public entry point, and it rejects anything without the shared bearer
# token before forwarding to the container.
#
# Setup on the VM:
#   1. sudo apt install -y nginx
#   2. Replace REPLACE_WITH_TOKEN below with a real random token
#      (e.g. `openssl rand -hex 32`) — the SAME value goes into
#      PISTON_AUTH_TOKEN in Vercel's env vars.
#   3. sudo cp piston-nginx.conf /etc/nginx/sites-available/piston
#   4. sudo ln -s /etc/nginx/sites-available/piston /etc/nginx/sites-enabled/
#   5. sudo rm -f /etc/nginx/sites-enabled/default
#   6. sudo nginx -t && sudo systemctl restart nginx
#   7. Open port 2000 in BOTH the VCN security list/NSG and the VM's own
#      iptables (Oracle Ubuntu images block it by default) — see README.

map $http_authorization $piston_auth_ok {
    default 0;
    "~*^Bearer\s+REPLACE_WITH_TOKEN$" 1;
}

server {
    listen 2000;
    server_name _;

    location / {
        if ($piston_auth_ok = 0) {
            return 401;
        }
        proxy_pass http://127.0.0.1:2000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
